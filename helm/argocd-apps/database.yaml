apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"  # SECOND to deploy
spec:
  project: default
  source:
    repoURL: https://github.com/srjbis/cloud-deploy.git
    path: helm/database-stack
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true