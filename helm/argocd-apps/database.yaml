apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-stack
  namespace: database
spec:
  project: default
  source:
    repoURL: https://github.com/srjbis/cloud-deploy.git
    path: database-stack
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: database